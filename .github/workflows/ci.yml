name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      DSH_SOURCE: ${{ runner.temp }}/dsh-source
      TMPDIR: ${{ runner.temp }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Prepare compatible DSH clone source and pinned pnpm
        run: |
          compatible_dsh_version="$(node --input-type=module -e "import { COMPATIBLE_DSH_VERSION } from './src/launcher.js'; console.log(COMPATIBLE_DSH_VERSION)")"
          git clone --depth 1 --branch "dsh-v${compatible_dsh_version}" https://github.com/deepseek-ai/deepseek-harness.git "${DSH_SOURCE}"
          corepack enable
          corepack prepare "$(node -p "require(process.env.DSH_SOURCE + '/package.json').packageManager")" --activate
      - name: Validate current sources and packed entrypoints
        id: validation
        run: npm run validate
      - name: Verify exact validated artifact
        run: npm run verify:artifact -- "${{ steps.validation.outputs.provenance }}"
      - name: Save verified package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: verified-package-node-${{ matrix.node-version }}
          path: |
            ${{ steps.validation.outputs.tarball }}
            ${{ steps.validation.outputs.provenance }}
            ${{ runner.temp }}/dsh-tui-validation-*/root-tests.tap
            ${{ runner.temp }}/dsh-tui-validation-*/tui-tests.json
          if-no-files-found: error
