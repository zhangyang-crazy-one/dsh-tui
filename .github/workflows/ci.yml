name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Run launcher tests
        run: npm test
      - name: Check out compatible DSH
        run: |
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { COMPATIBLE_DSH_VERSION } from './src/launcher.js'; writeFileSync(process.env.GITHUB_ENV, 'COMPATIBLE_DSH_VERSION=' + COMPATIBLE_DSH_VERSION + '\n', { flag: 'a' })"
          git clone --depth 1 --branch "dsh-v${COMPATIBLE_DSH_VERSION}" https://github.com/deepseek-ai/deepseek-harness.git "${RUNNER_TEMP}/deepseek-harness"
          corepack enable
          corepack prepare "pnpm@$(node -p "require('${RUNNER_TEMP}/deepseek-harness/package.json').packageManager.split('@')[1]")" --activate
          pnpm install --frozen-lockfile --dir "${RUNNER_TEMP}/deepseek-harness"
      - name: Run TUI tests
        env:
          DSH_SOURCE: ${{ runner.temp }}/deepseek-harness
        run: |
          npm run dev:setup
          node "${DSH_SOURCE}/node_modules/vitest/vitest.mjs" run packages/tui/tui/tests packages/tui/tui-render/tests --maxWorkers 2
      - name: Verify package contents
        run: npm run pack:check
