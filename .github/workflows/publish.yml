name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to verify
        required: true
        type: string
      prerelease:
        description: Publish an absent version to the npm next tag
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    env:
      DSH_SOURCE: ${{ runner.temp }}/dsh-source
      TMPDIR: ${{ runner.temp }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} must equal v${package_version}."
            exit 1
          fi
      - name: Check npm registry
        id: registry
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_git_head="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null || true)"
          if [[ -z "${published_git_head}" ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          checkout_git_head="$(git rev-parse HEAD)"
          if [[ "${published_git_head}" != "${checkout_git_head}" ]]; then
            echo "npm ${package_name}@${package_version} points to ${published_git_head}, not ${checkout_git_head}."
            exit 1
          fi
          echo "npm ${package_name}@${package_version} already contains this Git commit."
          echo "exists=true" >> "${GITHUB_OUTPUT}"
      - name: Prepare compatible DSH clone source and pinned pnpm
        run: |
          compatible_dsh_version="$(node --input-type=module -e "import { COMPATIBLE_DSH_VERSION } from './src/launcher.js'; console.log(COMPATIBLE_DSH_VERSION)")"
          git clone --depth 1 --branch "dsh-v${compatible_dsh_version}" https://github.com/deepseek-ai/deepseek-harness.git "${DSH_SOURCE}"
          corepack enable
          corepack prepare "$(node -p "require(process.env.DSH_SOURCE + '/package.json').packageManager")" --activate
      - name: Validate current sources and packed entrypoints
        id: validation
        run: npm run validate
      - name: Publish package
        if: steps.registry.outputs.exists != 'true'
        env:
          VERIFIED_TARBALL: ${{ steps.validation.outputs.tarball }}
          VERIFIED_PROVENANCE: ${{ steps.validation.outputs.provenance }}
          RELEASE_IS_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || inputs.prerelease }}
        run: |
          npm run verify:artifact -- "${VERIFIED_PROVENANCE}"
          npm_dist_tag="latest"
          if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
            npm_dist_tag="next"
          fi
          npm publish "${VERIFIED_TARBALL}" --access public --tag "${npm_dist_tag}"
      - name: Upload release asset
        env:
          VERIFIED_TARBALL: ${{ steps.validation.outputs.tarball }}
          VERIFIED_PROVENANCE: ${{ steps.validation.outputs.provenance }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          npm run verify:artifact -- "${VERIFIED_PROVENANCE}"
          gh release upload "${RELEASE_TAG}" "${VERIFIED_TARBALL}" "${VERIFIED_PROVENANCE}" --clobber


