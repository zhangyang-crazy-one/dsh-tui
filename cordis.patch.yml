# yaml-language-server: $schema=none
# The dsh-tui bundle layer: a terminal surface over @deepseek-ai/dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin parses --resume/--cwd and the task positional; the terminal
# driver then creates an Agent through the core registry. The UI displays one
# Session; scheduled reminders can activate other Sessions in the same process.
#
# Install it as a bundle so user settings (written to the profile layer)
# apply after this layer:
#   dsh plugin --profile tui add @crazyhappyone/dsh-tui
#   dsh --profile tui
# Rows target the dsh 0.2 Loader and name plugins through this package's
# exports, so profile-layer edits record a portable row name.

# The working directory reaches the model through the runtime-context
# message; dsh 0.2.1 registers no cwd prompt variable.
- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.
      You are interacting with the user through the dsh-tui
      terminal interface.

# HMR stays disabled. Profile and home patch edits apply on the next
# process start; /reload restarts the terminal with the current session.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: native

# Full-text session search stays disabled until the first Ctrl+K search (the
# base row's `openAt: never`). The TUI has no browser-latency concern, so the
# node:sqlite import and in-memory handle open lazily on first search.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# The first-prompt title gets the whole first prompt, not the base 4 KiB.
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 16384
    maxOutputTokens: 64
    timeoutMs: 60000

- insert:
    # Official task storage/runtime over the terminal's shared cold-Session
    # activation owner. No browser Session API or upload transport is mounted.
    - id: schedule
      name: '@crazyhappyone/dsh-tui/schedule'

    - id: tool-schedule
      name: '@deepseek-ai/dsh-tool-schedule'

    # Durable current-time context uses the process time zone and refreshes
    # at most once per ten minutes, matching the official provider defaults.
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        refreshIntervalMs: 600000

    # Explicit file deliveries stay in the owning Session log.
    - id: tool-present
      name: '@deepseek-ai/dsh-tool-present'
      config:
        maxFiles: 8

    # Per-round token/duration stats for the terminal status line.
    - id: session-stats
      name: "@deepseek-ai/dsh-session-stats"

    # Base owns the shared storage/domain/projection-cache stack. This layer
    # contributes only the TUI-facing feedback consumer over that stack.
    - id: message-feedback
      name: "@deepseek-ai/dsh-message-feedback"
      config:
        maxNoteBytes: 8192

    - id: tool-ask-user
      name: "@deepseek-ai/dsh-tool-ask-user"

    - id: tui-startup
      name: "@crazyhappyone/dsh-tui/startup"

    # TUI presentation preferences (locale, Enter behavior, notifications,
    # scrollbar, thinking visibility). Every field is volatile, so /settings
    # edits land in the profile layer and apply without a remount.
    - id: tui
      name: "@crazyhappyone/dsh-tui/settings"

    # In-process OpenCode Zen header proxy (vendored from
    # zhangyang-crazy-one/dsh-zen-proxy, MIT). Listens on localhost
    # only; point an opencode provider baseURL at
    # http://127.0.0.1:4097/v1 to reach the Zen free tier.
    # Remove this row to disable the listener.
    - id: zen-proxy
      name: "@crazyhappyone/dsh-tui/zen-proxy"
      config:
        host: 127.0.0.1
        port: 4097

    # Loopback route carrier for the DeepSeek account browser callback
    # (/login). Port 0 takes a free port from the OS; pin a port here when
    # an SSH session forwards it. Only routes registered by mounted plugins
    # are served, and the address must stay a loopback literal.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0

    # Records each top-level turn's changed files from git working-tree
    # snapshots; the TUI projects a bounded transcript card from Host
    # summaries. Bounds match the plugin Config defaults.
    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'
      config:
        timeoutMs: 30000
        outputMaxBytes: 8388608
        maxFiles: 500
        maxFileBytes: 2097152
        diffTimeoutMs: 100

    # Reads its task from the ordinary tuiStartup provider.
    - id: tui-runtime
      name: "@crazyhappyone/dsh-tui/runtime"
      inject: [tuiStartup]
      config:
        task: !!js ctx.tuiStartup.task
        resume: !!js ctx.tuiStartup.resume
        cwd: !!js ctx.tuiStartup.cwd
        model: !!js ctx.tuiStartup.model
        frameStats: !!js ctx.tuiStartup.frameStats
        # Render policy (overscan, stream pacing, scroll pacing, cache).
        # The values mirror the runtime Config schema defaults so the
        # deployment layer owns the tunables; override in the profile patch
        # to retune without touching the plugin.
        renderPolicy:
          transcriptOverscan: 16
          stream:
            frameIntervalMs: 16
            entryDepth: 64
            exitDepth: 32
            entryOldestAgeMs: 500
            exitOldestAgeMs: 250
            entryDrainBackpressureMs: 100
            exitDrainBackpressureMs: 50
            catchUpRowsPerFrame: 16
          scroll:
            frameIntervalMs: 16
            stepPerFrame: 1
            wheelRows: 3
            catchUpThreshold: 10
            maxCatchUpStep: 8
          cache:
            maxRows: 4096
            maxBytes: 4194304

# Terminal marketplace catalog uses the Host service; installs retain plugin-manager approval.
- insert:
    - id: plugin-market
      name: "@deepseek-ai/dsh-plugin-market"
